<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06142e">
<title>Aurora CRM · Viva a Plenitud</title>
<link rel="icon" href="assets/aurora-logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="assets/aurora-logo.png" alt="Aurora"><p>Más vidas. Más futuro.</p></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><p>Personas reales.<br>Historias reales.<br>Vidas aseguradas.</p></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
      <img class="top-logo" src="assets/aurora-logo.png" alt="Aurora">
      <label class="global-search"><span aria-hidden="true">⌕</span><input id="globalSearch" type="search" placeholder="Buscar contactos, teléfonos, correos..."></label>
      <button class="icon-btn bell" aria-label="Notificaciones">🔔<i></i></button>
      <div class="user"><span class="avatar">VP</span><span class="uname"><b>Equipo Aurora</b><small>Viva a Plenitud</small></span></div>
    </header>
    <main id="view" class="view"></main>
    <footer class="foot">AURORA <span>|</span> <b id="footSec">CRM</b> <span>|</span> Más vidas. Más futuro.</footer>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div class="kairos" id="kairos"><div class="bubble" id="bubble">Hola, soy Kairos. ¿En qué te ayudo hoy?</div><button id="kairosBtn" aria-label="Kairos"><img src="assets/kairos.png" alt="Kairos"></button></div>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
